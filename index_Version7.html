<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>开始对话</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #150d18;
      color: #fff;
    }

    body {
      display: grid;
      place-items: center;
      padding: 20px;
      background:
        linear-gradient(rgba(25, 12, 22, 0.52), rgba(25, 12, 22, 0.52)),
        url("photo.jpg") center center / cover no-repeat;
    }

    .chat-shell {
      width: min(100%, 620px);
      height: min(86vh, 760px);
      display: flex;
      flex-direction: column;
      background: rgba(17, 15, 25, 0.68);
      border: 1px solid rgba(255,255,255,0.16);
      border-radius: 24px;
      overflow: hidden;
      backdrop-filter: blur(10px);
      box-shadow: 0 30px 60px rgba(0,0,0,0.45);
    }

    .topbar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 18px 18px 14px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.03);
    }

    .avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: url("photo.jpg") center center / cover no-repeat;
      border: 2px solid rgba(255,255,255,0.5);
      flex-shrink: 0;
      box-shadow: 0 0 0 2px rgba(255,255,255,0.08);
    }

    .name-wrap {
      line-height: 1.2;
    }

    .name {
      font-size: 16px;
      font-weight: 700;
    }

    .status {
      font-size: 12px;
      color: rgba(255,255,255,0.6);
      margin-top: 3px;
    }

    .status-dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: #7ae7ad;
      margin-right: 6px;
      vertical-align: middle;
      box-shadow: 0 0 8px rgba(122, 231, 173, 0.8);
    }

    .messages {
      flex: 1;
      padding: 18px 18px 10px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: rgba(0,0,0,0.05);
    }

    .welcome {
      margin: auto auto 12px;
      max-width: 70%;
      text-align: center;
      font-size: 14px;
      line-height: 1.8;
      color: rgba(255,255,255,0.72);
      padding: 12px 16px;
      border-radius: 18px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.06);
    }

    .msg {
      max-width: 82%;
      padding: 12px 14px;
      border-radius: 18px;
      line-height: 1.8;
      font-size: 16px;
      word-break: break-word;
      animation: fadeIn 0.28s ease;
    }

    .msg.other {
      align-self: flex-start;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.08);
      border-bottom-left-radius: 6px;
      color: #f8f4ff;
    }

    .msg.self {
      align-self: flex-end;
      background: linear-gradient(135deg, #ffd7df, #f4bfd7);
      color: #2b1725;
      border-bottom-right-radius: 6px;
      box-shadow: 0 10px 22px rgba(255, 173, 202, 0.18);
    }

    .composer {
      display: none;
      gap: 10px;
      padding: 14px 18px 18px;
      border-top: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.02);
    }

    .composer.visible {
      display: flex;
    }

    textarea {
      flex: 1;
      min-height: 52px;
      max-height: 140px;
      resize: vertical;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 14px;
      background: rgba(255,255,255,0.04);
      color: #fff;
      font: inherit;
      padding: 12px 14px;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    textarea:focus {
      border-color: rgba(255, 204, 214, 0.9);
      box-shadow: 0 0 0 3px rgba(255, 204, 214, 0.18);
    }

    .send-btn {
      align-self: flex-end;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, #ffdfe8, #f5bfd8);
      color: #2d1b2d;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      padding: 12px 18px;
      min-width: 84px;
      transition: transform 0.2s ease, filter 0.2s ease;
    }

    .send-btn:hover {
      transform: translateY(-1px);
      filter: brightness(1.02);
    }

    .start-btn {
      margin: 16px 18px 20px;
      border: none;
      border-radius: 16px;
      padding: 15px 18px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      color: #251926;
      background: linear-gradient(135deg, #ffdfe8, #f0bbd1);
      box-shadow: 0 16px 30px rgba(240, 187, 209, 0.28);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .start-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 18px 34px rgba(240, 187, 209, 0.34);
    }

    .start-btn.hidden {
      display: none;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 520px) {
      .chat-shell {
        height: 90vh;
      }
      .msg {
        font-size: 15px;
      }
      .composer {
        gap: 8px;
      }
      .send-btn {
        min-width: 72px;
        padding-left: 12px;
        padding-right: 12px;
      }
    }
  </style>
</head>
<body>
  <div class="chat-shell">
    <div class="topbar">
      <div class="avatar"></div>
      <div class="name-wrap">
        <div class="name">HYH</div>
        <div class="status"><span class="status-dot"></span>在线</div>
      </div>
    </div>

    <div class="messages" id="messages">
      <div class="welcome" id="welcomeText">
        有一句话，<br>
        我想认真地说给你听。
      </div>
    </div>

    <div class="composer" id="composer">
      <textarea id="replyInput" placeholder="编辑你的回复..."></textarea>
      <button class="send-btn" id="sendBtn">发送</button>
    </div>

    <button class="start-btn" id="startBtn">开始对话</button>
  </div>

  <script>
    const messages = document.getElementById("messages");
    const composer = document.getElementById("composer");
    const startBtn = document.getElementById("startBtn");
    const sendBtn = document.getElementById("sendBtn");
    const replyInput = document.getElementById("replyInput");
    const welcomeText = document.getElementById("welcomeText");

    const firstMessage = "HYH，我喜欢你很久了，整整990天。";

    function addMessage(text, type) {
      const bubble = document.createElement("div");
      bubble.className = "msg " + type;
      bubble.textContent = text;
      messages.appendChild(bubble);
      messages.scrollTop = messages.scrollHeight;
    }

    startBtn.addEventListener("click", function () {
      startBtn.classList.add("hidden");
      composer.classList.add("visible");
      welcomeText.style.display = "none";

      addMessage(firstMessage, "other");
      replyInput.focus();
    });

    sendBtn.addEventListener("click", function () {
      const value = replyInput.value.trim();

      if (!value) {
        replyInput.focus();
        replyInput.placeholder = "先写一点内容再发送哦";
        return;
      }

      addMessage(value, "self");
      replyInput.value = "";
      replyInput.placeholder = "编辑你的回复...";
      replyInput.focus();
    });

    replyInput.addEventListener("keydown", function (e) {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendBtn.click();
      }
    });
  </script>
</body>
</html>
